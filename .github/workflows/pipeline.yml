# The deployment pipeline and the only gate on main: the ruleset on main
# requires its commit and acceptance jobs, and a pull request merges itself
# once they pass. The commit stage gives feedback in under five minutes, the
# acceptance stage tests the very binary the commit stage built, alone and
# inside the release image, and a version tag releases that binary.
name: pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  # A new push to a pull request supersedes its running checks; a run on main
  # or a tag always finishes, since a release cut short is half published.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: commit / test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # go.mod names an exact patch, so every job, the release included,
      # builds with the same Go. setup-go sets GOTOOLCHAIN=local: a tool whose
      # go.mod needs a newer Go fails here instead of downloading one.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            devtools/*/go.sum
      - run: make build tidy vet test coverage
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usechrome-mcp
          path: dist/usechrome-mcp
          if-no-files-found: error
          retention-days: 7

  lint:
    name: commit / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            devtools/*/go.sum
      - run: make lint

  audit:
    name: commit / audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            devtools/*/go.sum
      - run: make vuln secrets workflows release-check
      # The messages that will land on main: a rebase merge keeps a pull
      # request's commits, and a Dependabot pull request merges squashed into
      # one commit whose message scripts/squash-subject.sh makes from its
      # title. A push has the commits main does not have yet, which for a tag
      # on main is none.
      - name: commit messages
        env:
          DEPENDABOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $DEPENDABOT == true ]]; then
            make squash-message
          elif [[ -n $BASE ]]; then
            make commit-messages COMMITS="$BASE..$HEAD_SHA"
          else
            make commit-messages COMMITS=origin/main..HEAD
          fi

  acceptance:
    name: acceptance / binary
    needs: [test, lint, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: usechrome-mcp
          path: dist
      # Artifacts lose the executable bit in transit.
      - run: chmod +x dist/usechrome-mcp && make acceptance

  acceptance-image:
    name: acceptance / image
    needs: [test, lint, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: usechrome-mcp
          path: dist
      - run: chmod +x dist/usechrome-mcp && make acceptance-image

  release:
    name: release
    if: github.ref_type == 'tag'
    needs: [acceptance, acceptance-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub Release
      packages: write # the image on GHCR
      id-token: write # the Sigstore certificate that signs attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog is the history since the last tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            devtools/*/go.sum
      # Outside the checkout, which GoReleaser requires to be clean.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: usechrome-mcp
          path: ${{ runner.temp }}/tested
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_BIN: ${{ runner.temp }}/tested/usechrome-mcp
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - id: image
        run: echo "digest=$(docker buildx imagetools inspect "ghcr.io/joaomdsg/usechrome-mcp:$GITHUB_REF_NAME" --format '{{.Manifest.Digest}}')" >>"$GITHUB_OUTPUT"
      # Storage records exist only for organization-owned repositories.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/joaomdsg/usechrome-mcp
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
