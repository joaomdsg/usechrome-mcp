# Dependency updates arrive as pull requests that the pipeline gates like any
# other change. Each ecosystem's updates come grouped into one pull request a
# week. The cooldown leaves a new release a week for its maintainers or
# scanners to catch a compromised or broken version before it lands here.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/devtools/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
    # GoReleaser 2.18 needs Go 1.27, and setup-go runs only the Go that go.mod
    # names (1.26.10); one failing bump would hold back the whole group.
    ignore:
      - dependency-name: github.com/goreleaser/goreleaser/v2
        versions: [">= 2.18.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
